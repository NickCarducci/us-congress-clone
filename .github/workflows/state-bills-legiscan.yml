# LegiScan's weekly session datasets, the state bills' base layer (Open
# States' monthly dump, state-bills-dump.yml, is the fallback for sessions
# LegiScan doesn't cover). Daily: one getDatasetList query says which current
# sessions' archives changed; only those are downloaded (one query each), so a
# week's update lands within a day for about 60 queries a week of the free
# key's monthly limit. Converted to Open States' session-JSON shape by
# scripts/legiscan_datasets.py, synced to state-bills-data/legiscan/, and the
# changed states' catalogs rebuilt. Does nothing until LEGISCAN_API_KEY is set.
name: State Bills (LegiScan weekly)

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      states:
        description: Comma-separated state codes (empty = every state)
        default: ""
        required: false

permissions:
  contents: read

concurrency:
  group: state-bills-legiscan
  cancel-in-progress: false

jobs:
  datasets:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HAVE_KEY: ${{ secrets.LEGISCAN_API_KEY != '' }}
    steps:
      - name: No key yet
        if: env.HAVE_KEY != 'true'
        run: echo "LEGISCAN_API_KEY is not set; nothing to do." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: env.HAVE_KEY == 'true'

      # The dataset hashes already synced, kept on the server beside the files.
      - name: Read the synced dataset hashes
        if: env.HAVE_KEY == 'true'
        env:
          KEY: ${{ secrets.SCYTALE_SSH_KEY }}
          HOST: ${{ secrets.SCYTALE_HOST }}
        run: |
          install -m 600 /dev/null ~/scytale.key && printf '%s\n' "$KEY" > ~/scytale.key
          ssh -i ~/scytale.key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "ubuntu@$HOST" \
            'cat /home/ubuntu/state-bills-data/legiscan/hashes.json 2>/dev/null || echo "{}"' > hashes.json
          rm -f ~/scytale.key

      - name: Download changed sessions
        id: fetch
        if: env.HAVE_KEY == 'true'
        env:
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
          STATES: ${{ inputs.states }}
        run: |
          mkdir -p out
          python3 scripts/legiscan_datasets.py hashes.json out --states "$STATES" | tee fetch.log
          states=$(awk -F'\t' '$1 != "QUERIES" && $1 !~ /^warning/ {print $1}' fetch.log | sort -u | tr '\n' ' ')
          echo "states=$states" >> "$GITHUB_OUTPUT"
          {
            echo "### LegiScan datasets"
            echo
            echo "| State | Session | Bills |"
            echo "|---|---|---:|"
            awk -F'\t' '$1 != "QUERIES" && $1 !~ /^warning/ {print "| " $1 " | " $2 " | " $3 " |"}' fetch.log
            echo
            awk -F'\t' '$1 == "QUERIES" {print "Queries spent: " $2}' fetch.log
          } >> "$GITHUB_STEP_SUMMARY"
          cp hashes.json out/hashes.json

      - name: Prepare the server folder
        if: env.HAVE_KEY == 'true' && steps.fetch.outputs.states != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SCYTALE_HOST }}
          username: ubuntu
          key: ${{ secrets.SCYTALE_SSH_KEY }}
          script: mkdir -p /home/ubuntu/state-bills-data/legiscan

      # No --delete: a session that stops being current keeps its last copy.
      - name: Sync to the server
        if: env.HAVE_KEY == 'true' && steps.fetch.outputs.states != ''
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -r -c -4
          path: out/
          remote_path: /home/ubuntu/state-bills-data/legiscan/
          remote_host: ${{ secrets.SCYTALE_HOST }}
          remote_user: ubuntu
          remote_key: ${{ secrets.SCYTALE_SSH_KEY }}

      - name: Rebuild the changed states' catalogs
        if: env.HAVE_KEY == 'true' && steps.fetch.outputs.states != ''
        uses: appleboy/ssh-action@v1
        env:
          STATES: ${{ steps.fetch.outputs.states }}
        with:
          host: ${{ secrets.SCYTALE_HOST }}
          username: ubuntu
          key: ${{ secrets.SCYTALE_SSH_KEY }}
          envs: STATES
          command_timeout: 60m
          script: node /home/ubuntu/microservice/Consumers/POP-U-LIST/stateBillCatalog.cjs /home/ubuntu/state-bills-data $STATES

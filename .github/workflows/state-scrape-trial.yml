# Trial: run Open States' own open-source scraper for one state, the way
# bill-watcher.yml runs the unitedstates/congress scraper, to measure how long
# a state takes and what it produces. No Open States account or API key; the
# scraper reads the legislature's site directly. Output (one JSON per bill) is
# kept as an artifact for the mirror's mapping.
name: State Scrape Trial

on:
  workflow_dispatch:
    inputs:
      state:
        description: Two-letter state code (lowercase), e.g. nj
        default: nj
        required: true
      extra:
        description: Extra os-update arguments (e.g. "session=2026"; otherwise the current session is picked)
        default: ""
        required: false

permissions:
  contents: read

concurrency:
  group: state-scrape-${{ inputs.state }}
  cancel-in-progress: false

env:
  # openstates/openstates-scrapers (GPL-3.0), pinned for reproducibility.
  SCRAPERS_SHA: 51fa072bacef2d80499945bc11f870fc5e5c4db8

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check out this repository (session picker)
        uses: actions/checkout@v4
        with:
          path: clone

      - name: Check out the Open States scrapers
        uses: actions/checkout@v4
        with:
          repository: openstates/openstates-scrapers
          ref: ${{ env.SCRAPERS_SHA }}
          path: scrapers

      - name: Patch scrapers for legislature-site changes
        run: python3 clone/scripts/patch_state_scrapers.py scrapers

      - name: Build the scraper image
        env:
          STATE: ${{ inputs.state }}
        run: |
          # California loads the legislature's database export into MariaDB
          # (bundled in Open States' California image) before scraping it.
          if [ "$STATE" = ca ]; then
            docker build -q -f scrapers/Dockerfile.california -t os-scrapers scrapers
          else
            docker build -q -t os-scrapers scrapers
          fi

      - name: Pick the current session
        id: session
        env:
          STATE: ${{ inputs.state }}
          EXTRA: ${{ inputs.extra }}
        run: |
          if [[ "$EXTRA" == *session=* ]]; then echo "args=" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Run from the scrapers' folder so "scrapers.<state>" imports.
          session=$(docker run --rm -v "$PWD/clone/scripts:/picker:ro" -w /opt/openstates/openstates \
            -e PYTHONPATH=/opt/openstates/openstates:/opt/openstates/openstates/scrapers --entrypoint python \
            os-scrapers /picker/current_session.py "$STATE")
          echo "Current session: ${session:-(scraper default)}"
          [ -n "$session" ] && echo "args=session=$session" >> "$GITHUB_OUTPUT" || echo "args=" >> "$GITHUB_OUTPUT"

      - name: Scrape bills (no database)
        id: scrape
        env:
          STATE: ${{ inputs.state }}
          EXTRA: ${{ inputs.extra }}
          SESSION: ${{ steps.session.outputs.args }}
        run: |
          mkdir -p out
          start=$(date +%s)
          set +e
          if [ "$STATE" = ca ]; then
            # Starts MariaDB, downloads and loads CA's export, then runs os-update ca "$@".
            docker run --rm -v "$PWD/out:/out" -e PYTHONPATH=./scrapers --entrypoint /bin/bash \
              os-scrapers scrapers/ca/ca-entrypoint.sh bills $SESSION $EXTRA --scrape --datadir /out 2>&1 | tee scrape.log | tail -n 200
          else
            docker run --rm -v "$PWD/out:/out" -e PYTHONPATH=./scrapers --entrypoint os-update \
              os-scrapers "$STATE" bills $SESSION $EXTRA --scrape --datadir /out 2>&1 | tee scrape.log | tail -n 200
          fi
          status=${PIPESTATUS[0]}
          set -e
          elapsed=$(( $(date +%s) - start ))
          bills=$(find out -name 'bill_*.json' | wc -l)
          echo "elapsed=$elapsed" >> "$GITHUB_OUTPUT"
          {
            echo "### $STATE bill scrape"
            echo "- exit status: $status"
            echo "- elapsed: $((elapsed / 60)) min $((elapsed % 60)) s"
            echo "- bill files: $bills"
            echo "- output size: $(du -sh out | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Pack the output
        if: always()
        # Some file names carry colons (jurisdiction IDs), which artifacts reject.
        run: tar -czf scrape-${{ inputs.state }}.tgz out scrape.log

      - name: Keep the output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-${{ inputs.state }}
          path: scrape-${{ inputs.state }}.tgz
          retention-days: 7

name: Legislative Index Sync
on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [all, federal, state, local]
        default: all
permissions:
  contents: read
concurrency:
  group: legislative-index-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Index existing published catalogs
        uses: appleboy/ssh-action@v1
        env:
          INDEX_SCOPE: ${{ inputs.scope || 'all' }}
        with:
          host: ${{ secrets.SCYTALE_HOST }}
          username: ubuntu
          key: ${{ secrets.SCYTALE_SSH_KEY }}
          command_timeout: 350m
          envs: INDEX_SCOPE
          script: bash /home/ubuntu/microservice/Consumers/POP-U-LIST/node/scripts/sync-legislative-index.sh "$INDEX_SCOPE"

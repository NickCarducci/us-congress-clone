name: Bill Data Watcher

# Mirrors rollcall-watcher.yml's approach (a bulk clone of official public
# data via unitedstates/congress, not live per-request Congress.gov API
# calls) but stays a separate workflow/cache/scraper-checkout on purpose —
# bill data and vote data are unrelated datasets with different freshness
# needs (bills change daily; roll calls are comparatively rare), so they're
# scraped and synced independently rather than coupled into one job.

on:
  # No blind schedule here anymore -- govinfo-billstatus-watcher.yml polls
  # GovInfo's own batch-completion RSS feed every 15 minutes and triggers
  # this job (via workflow_dispatch) only when a genuinely new batch has
  # landed, instead of guessing a fixed interval and either lagging
  # GovInfo's real ~4-hour cadence or running this when nothing changed.
  workflow_dispatch:

concurrency:
  group: bill-watcher
  cancel-in-progress: true

env:
  # 119th Congress = 2025-2026. Bump this at the start of each new Congress (odd years).
  CURRENT_CONGRESS: 119

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # Scraper output (data/ + cache/) persists across runs via this cache.
      # govinfo's sitemap-based fetch (see below) already skips anything
      # whose <lastmod> hasn't changed, so daily runs after the first are
      # cheap incremental diffs, not a full re-download.
      - name: Restore scraper working directory
        uses: actions/cache@v4
        with:
          path: bill-scraper
          key: bill-scraper-${{ env.CURRENT_CONGRESS }}-${{ github.run_id }}
          restore-keys: |
            bill-scraper-${{ env.CURRENT_CONGRESS }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone/update unitedstates/congress scraper
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-dev libxslt1-dev libz-dev wget

          if [ -d bill-scraper/.git ]; then
            git -C bill-scraper fetch --depth=1 origin main
            git -C bill-scraper reset --hard origin/main
          else
            rm -rf bill-scraper
            git clone --depth=1 https://github.com/unitedstates/congress.git bill-scraper
          fi

          pip install -q ./bill-scraper
          mkdir -p bill-scraper/data bill-scraper/cache

      # Bill status comes from GovInfo's official bulk BILLSTATUS collection
      # (public, no API key, no rate limit) — the same "cloner" pattern as
      # votes, not a scrape of api.congress.gov. `bills` then parses those
      # XML files into one data.json per bill (title, sponsor, actions,
      # committees, summary — everything the feed and detail view need).
      - name: Clone current-Congress bill status data
        run: |
          set -euo pipefail
          cd bill-scraper
          usc-run govinfo --bulkdata=BILLSTATUS --congress="${CURRENT_CONGRESS}"
          usc-run bills --congress="${CURRENT_CONGRESS}"

      # Full bill text, plain-text format. GovInfo's BILLS collection (the
      # regular, non-bulk one -- distinct from --bulkdata=BILLS, "which has
      # less in it" per govinfo.py's own comment) ships text/pdf/xml/mods
      # per print version. --extract=text pulls the text format (GovInfo
      # wraps it in HTML; the scraper auto-unwraps it into a plain
      # document.txt alongside document.html) and --extract=mods pulls the
      # per-version metadata (type/date) as its own data.json --
      # get_output_path() for the BILLS collection places both under
      # data/{congress}/bills/{type}/{type}{number}/text-versions/{version}/,
      # right alongside the bill's own data.json, so no new directory
      # convention to teach the backend. Deliberately NOT pulling pdf here
      # -- plain text is a small fraction of the size (no embedded
      # fonts/layout) and is what the app actually renders now (see
      # BillTextViewerSheet), so there's no reason to also mirror the much
      # larger PDF just to leave it unused.
      #
      # --congress does NOT scope this the way it does --bulkdata=BILLSTATUS
      # above -- per govinfo.py's own header comment, --congress only
      # applies to bulk data collections; --collections=BILLS is a regular
      # (non-bulk) collection, scoped only by --years or --filter. Without
      # this, the first attempt walked GovInfo's entire BILLS collection
      # back to the 113th Congress (2013) and hit the 180-minute timeout
      # without finishing.
      #
      # Two complementary filters, not redundant: --years skips walking the
      # sitemap index for other years entirely (should_skip_sitemap checks
      # this before even fetching a year's sitemap XML), while --filter
      # (matched against the package name, e.g. "BILLS-119hr1234ih") skips
      # downloading individual non-matching packages within a year's
      # sitemap -- needed because a bill introduced late in the prior
      # Congress can still get a matching-year print version, and CURRENT_
      # CONGRESS_YEARS has to be updated every two years anyway, so
      # --filter is the real correctness guarantee; --years is purely a
      # speed-up on top of it.
      - name: Clone current-Congress bill text (plain text)
        env:
          # 119th Congress = 2025-2026 -- keep in sync with CURRENT_CONGRESS
          # above (both bump together at the start of each new Congress).
          CURRENT_CONGRESS_YEARS: "2025,2026"
        run: |
          set -euo pipefail
          cd bill-scraper
          usc-run govinfo --collections=BILLS --years="${CURRENT_CONGRESS_YEARS}" --filter="^BILLS-${CURRENT_CONGRESS}" --extract=mods,text

      # --exclude=.git keeps this workflow from touching the dataset-revision
      # marker (`git rev-parse HEAD` on the synced tree) that
      # rollcall-watcher.yml's own sync already owns for vote-data freshness
      # checks — both workflows clone the same upstream scraper repo, and
      # this dataset only needs bill-watcher's data/ output, not its .git.
      - name: Sync bill data to server
        uses: burnett01/rsync-deployments@7.0.1
        with:
          # package.zip is the raw per-version archive (PDF+XML+HTML+MODS+
          # PREMIS all bundled) the govinfo step above downloads before
          # extracting from it -- document.txt is already extracted out of
          # it, so there's no reason to also ship the much larger original
          # archive to the server. document.html is the pre-unwrap wrapped
          # copy of the same text as document.txt -- redundant once
          # unwrapped.
          switches: -avz -4 --exclude=cache/ --exclude=.git/ --exclude=package.zip --exclude=document.html
          path: bill-scraper/
          remote_path: /home/ubuntu/us-congress-data/
          remote_host: ${{ secrets.SCYTALE_HOST }}
          remote_user: ubuntu
          remote_key: ${{ secrets.SCYTALE_SSH_KEY }}

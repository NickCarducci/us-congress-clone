name: Bill Data Watcher

# Mirrors rollcall-watcher.yml's approach (a bulk clone of official public
# data via unitedstates/congress, not live per-request Congress.gov API
# calls) but stays a separate workflow/cache/scraper-checkout on purpose —
# bill data and vote data are unrelated datasets with different freshness
# needs (bills change daily; roll calls are comparatively rare), so they're
# scraped and synced independently rather than coupled into one job.
#
# Bill TEXT is deliberately NOT cloned here -- see bill-text-watcher.yml.
# A first attempt at bundling both into this workflow caused a real
# outage: bill text takes hours to backfill, but this workflow is
# triggered every time govinfo-billstatus-watcher.yml sees a new
# BILLSTATUS batch (every ~15 min at busiest) with cancel-in-progress
# true -- every new trigger killed the still-running text backfill before
# it could finish, forever. Bill status changes constantly and needs the
# frequent trigger; bill text, once a version is printed, never changes
# again. Splitting them into
# workflows with independent concurrency groups and schedules fixes both
# at once.

on:
  # No blind schedule here anymore -- govinfo-billstatus-watcher.yml polls
  # GovInfo's own batch-completion RSS feed every 15 minutes and triggers
  # this job (via workflow_dispatch) only when a genuinely new batch has
  # landed, instead of guessing a fixed interval and either lagging
  # GovInfo's real ~4-hour cadence or running this when nothing changed.
  workflow_dispatch:
    inputs:
      first_congress:
        # Prior Congresses are imported in resumable batches by
        # legislation-archive.yml. Re-scanning the previous Congress here on
        # every BILLSTATUS batch cost ~2h45m per run (19,315 files for the
        # 118th), pushed every run past the timeout and stalled the feed
        # after Oct 28 2026. Only set this for a one-off manual backfill.
        description: 'First Congress to mirror (empty = current Congress only)'
        required: false

concurrency:
  group: bill-watcher
  # A historical first import must finish even if a new batch arrives.
  cancel-in-progress: false

env:
  # 119th Congress = 2025-2026. Bump this at the start of each new Congress (odd years).
  CURRENT_CONGRESS: 119

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # Scraper output (data/ + cache/) persists across runs via this cache.
      # govinfo's sitemap-based fetch (see below) already skips anything
      # whose <lastmod> hasn't changed, so daily runs after the first are
      # cheap incremental diffs, not a full re-download. Shared with
      # bill-text-watcher.yml's cache (same key prefix) so both workflows
      # build on the same scraper checkout + already-downloaded data
      # instead of duplicating the clone/setup cost.
      - name: Select Congress window
        env:
          FIRST_CONGRESS: ${{ inputs.first_congress }}
        run: |
          python3 - <<'PYTHON'
          import datetime, os
          today = datetime.date.today()
          current = (today.year - 1789) // 2 + 1 - int(today.year % 2 == 1 and today < datetime.date(today.year, 1, 3))
          first = int(os.environ.get('FIRST_CONGRESS') or current)
          if not 93 <= first <= current:
              raise SystemExit('Invalid first Congress')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'CURRENT_CONGRESS={current}\nFIRST_CONGRESS={first}\n')
          PYTHON

      # Restore and save are separate steps so a run that fails or times
      # out still saves what it downloaded (actions/cache saves only after
      # a successful job). The next run resumes from those lastmod markers
      # instead of starting over, so a large catch-up spreads across runs.
      - name: Restore scraper working directory
        uses: actions/cache/restore@v4
        with:
          path: bill-scraper
          key: bill-scraper-${{ env.CURRENT_CONGRESS }}-${{ github.run_id }}
          restore-keys: |
            bill-scraper-${{ env.CURRENT_CONGRESS }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone/update unitedstates/congress scraper
        run: |
          set -euo pipefail
          # Build headers only matter if lxml has no prebuilt wheel (it has
          # one for this Python), and wget ships with the runner image. A
          # runner whose Ubuntu mirror can't be reached (2026-11-11: DNS
          # failures for azure.archive.ubuntu.com) shouldn't fail the sync.
          { sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-dev libxslt1-dev libz-dev wget; } \
            || echo "::warning::apt-get failed; continuing with the runner's preinstalled packages"

          if [ -d bill-scraper/.git ]; then
            git -C bill-scraper fetch --depth=1 origin main
            git -C bill-scraper reset --hard origin/main
          else
            rm -rf bill-scraper
            git clone --depth=1 https://github.com/unitedstates/congress.git bill-scraper
          fi

          pip install -q ./bill-scraper
          mkdir -p bill-scraper/data bill-scraper/cache

      # Bill status comes from GovInfo's official bulk BILLSTATUS collection
      # (public, no API key, no rate limit) — the same "cloner" pattern as
      # votes, not a scrape of api.congress.gov. `bills` then parses those
      # XML files into one data.json per bill (title, sponsor, actions,
      # committees, summary — everything the feed and detail view need).
      - name: Clone current-Congress bill status data
        id: clone
        # Leaves time for the cache save below before the job timeout.
        timeout-minutes: 160
        run: |
          set -euo pipefail
          cd bill-scraper
          # Current Congress first, so a manual backfill never delays it.
          for congress in $(seq "$CURRENT_CONGRESS" -1 "$FIRST_CONGRESS"); do
            usc-run govinfo --bulkdata=BILLSTATUS --congress="$congress"
            usc-run bills --congress="$congress"
          done

      - name: Save scraper progress
        if: always() && steps.clone.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: bill-scraper
          key: bill-scraper-${{ env.CURRENT_CONGRESS }}-${{ github.run_id }}-${{ github.run_attempt }}

      # --exclude=.git keeps this workflow from touching the dataset-revision
      # marker (`git rev-parse HEAD` on the synced tree) that
      # rollcall-watcher.yml's own sync already owns for vote-data freshness
      # checks — both workflows clone the same upstream scraper repo, and
      # this dataset only needs bill-watcher's data/ output, not its .git.
      # No --delete flag, so this never removes bill-text-watcher.yml's
      # text-versions/ output even though this workflow's own bill-scraper
      # checkout doesn't populate it.
      - name: Sync bill data to server
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz -4 --exclude=cache/ --exclude=.git/
          path: bill-scraper/
          remote_path: /home/ubuntu/us-congress-data/
          remote_host: ${{ secrets.SCYTALE_HOST }}
          remote_user: ubuntu
          remote_key: ${{ secrets.SCYTALE_SSH_KEY }}

      - name: Prepare searchable catalogs after bill sync
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SCYTALE_HOST }}
          username: ubuntu
          key: ${{ secrets.SCYTALE_SSH_KEY }}
          envs: FIRST_CONGRESS,CURRENT_CONGRESS
          script: |
            set -eu
            for congress in $(seq "$FIRST_CONGRESS" "$CURRENT_CONGRESS"); do
              node /home/ubuntu/microservice/Consumers/POP-U-LIST/prepareBillCatalog.cjs /home/ubuntu/us-congress-data "$congress"
            done

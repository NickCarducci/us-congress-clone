# Current-session bills for every state legislature, the way bill-watcher.yml
# mirrors Congress: Open States' open-source scrapers (GPL-3.0) read each
# legislature's own site here, the bill JSON is synced to the server as files
# (like us-congress-data), and the app's catalog for that state is rebuilt. No
# Open States account or API quota is spent on scraped states; the app's API
# watcher keeps covering the rest (state-sources.json says which and why).
#
# Most legislatures publish no change feed like GovInfo's BILLSTATUS RSS, so
# Open States' API stands in for one: before each pass, one updated_since
# request per state (OPEN_STATES_KEY) asks whether anything changed since that
# state's last finished scrape, and only states that changed are scraped.
# Passes: overnight (US time), and one that resumes any state cut off by the
# 6-hour job limit (pages fetched today are cached).
name: State Bill Watcher

on:
  schedule:
    - cron: "0 6 * * *"    # 1-2 AM Eastern: the full daily pass
    - cron: "30 13 * * *"  # resumes states the first pass didn't finish
  workflow_dispatch:
    inputs:
      states:
        description: Comma-separated state codes (empty = every scraped state in state-sources.json)
        default: ""
        required: false

permissions:
  contents: read
  issues: write   # a failed scrape check opens an issue

concurrency:
  # Scheduled passes queue behind each other; a run for named states (by hand)
  # has its own queue, so it needn't wait hours for a pass on other states.
  group: state-bill-watcher-${{ inputs.states || 'all' }}
  cancel-in-progress: false   # a long state must finish; the next pass queues

env:
  # openstates/openstates-scrapers (GPL-3.0), followed at its latest commit:
  # Open States adds each legislature's new session there (every January for
  # most states), and a pinned copy would keep scraping the old one or refuse
  # to run on the new one. scripts/patch_state_scrapers.py skips any of our
  # patches upstream has made unnecessary; the commit used is in each run's summary.
  SCRAPERS_REF: main

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      # Each job's last finished scrape, stamped on the server by the last step below.
      - name: When each state was last scraped
        env:
          KEY: ${{ secrets.SCYTALE_SSH_KEY }}
          HOST: ${{ secrets.SCYTALE_HOST }}
        run: |
          install -m 600 /dev/null ~/scytale.key && printf '%s\n' "$KEY" > ~/scytale.key
          ssh -i ~/scytale.key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "ubuntu@$HOST" \
            'cd /home/ubuntu/state-bills-data/scrape 2>/dev/null && for f in */.scraped_at; do [ -f "$f" ] && echo "${f%/.scraped_at} $(cat "$f")"; done; true' \
            > scraped_at.txt || : > scraped_at.txt
          # Each scrape's last checkpoint (scripts/checkpointed_scrape.sh), here and on the server.
          ssh -i ~/scytale.key -o ConnectTimeout=20 "ubuntu@$HOST" \
            'cd /home/ubuntu/state-bills-data/scrape 2>/dev/null && for f in */.health.json; do [ -f "$f" ] && cat "$f"; done; true' \
            > health.jsonl || : > health.jsonl
          rm -f ~/scytale.key
          echo "$(wc -l < scraped_at.txt) scrape times read"
      # One open issue per state whose last scrape failed its check or crashed;
      # closed again by hand once fixed. Cut-off scrapes aren't failures.
      - name: Open issues for failed scrapes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > failed.tsv
          import json
          for line in open("health.jsonl"):
              line = line.strip()
              if not line:
                  continue
              try:
                  h = json.loads(line)
              except ValueError:
                  continue
              if h.get("phase") == "failed":
                  detail = "; ".join(h.get("examples") or [])
                  print("\t".join([h.get("label", "?"), h.get("at", ""), h.get("message", ""),
                                   f'{h.get("bills", 0)} bills, {h.get("invalid", 0)} improper', detail]))
          PY
          while IFS=$'\t' read -r label at message counts detail; do
            title="State scrape failed: $label"
            if [ -z "$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number -q '.[0].number')" ]; then
              gh issue create -R "$GITHUB_REPOSITORY" --title "$title" \
                --body "$message ($at): $counts. ${detail:-}"$'\n\n'"From the scrape's last checkpoint (scrape/$label/.health.json on the server)." \
                && echo "opened: $title"
            fi
          done < failed.tsv

      - id: plan
        env:
          STATES: ${{ inputs.states }}
          OPEN_STATES_KEY: ${{ secrets.OPEN_STATES_KEY }}
          # Only whether each key is set; the values never reach this job.
          HAVE_SECRETS: >-
            ${{ secrets.NEW_YORK_API_KEY != '' && 'NEW_YORK_API_KEY,' || '' }}${{ secrets.INDIANA_API_KEY != '' && 'INDIANA_API_KEY,' || '' }}${{ secrets.DC_API_KEY != '' && 'DC_API_KEY,' || '' }}
        run: |
          matrix=$(python3 scripts/plan_states.py state-sources.json "$STATES" scraped_at.txt)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "any=$(jq '.include | length > 0' <<< "$matrix")" >> "$GITHUB_OUTPUT"

  scrape:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360   # GitHub-hosted runners' ceiling for one job
    strategy:
      fail-fast: false
      # Leaves runners free for the Congress watchers (20 concurrent jobs per account).
      max-parallel: 16
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      STATE: ${{ matrix.state }}
      CHAMBER: ${{ matrix.chamber }}
      LABEL: ${{ matrix.state }}${{ matrix.chamber }}
    steps:
      - name: Check out this repository (session picker, patches)
        uses: actions/checkout@v4
        with:
          path: clone

      - name: Check out the Open States scrapers
        uses: actions/checkout@v4
        with:
          repository: openstates/openstates-scrapers
          ref: ${{ env.SCRAPERS_REF }}
          path: scrapers

      - name: Patch scrapers for legislature-site changes
        run: |
          echo "Open States scrapers at $(git -C scrapers rev-parse --short HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 clone/scripts/patch_state_scrapers.py scrapers

      - name: Build the scraper image
        run: |
          # California loads the legislature's database export into MariaDB
          # (bundled in Open States' California image) before scraping it.
          if [ "$STATE" = ca ]; then
            docker build -q -f scrapers/Dockerfile.california -t os-scrapers scrapers
          else
            docker build -q -t os-scrapers scrapers
          fi

      - name: Pick the current session
        id: session
        run: |
          session=$(docker run --rm -v "$PWD/clone/scripts:/picker:ro" -w /opt/openstates/openstates \
            -e PYTHONPATH=/opt/openstates/openstates:/opt/openstates/openstates/scrapers --entrypoint python \
            os-scrapers /picker/current_session.py "$STATE")
          echo "Current session: ${session:-(scraper default)}"
          [ -n "$session" ] && echo "args=session=$session" >> "$GITHUB_OUTPUT" || echo "args=" >> "$GITHUB_OUTPUT"

      - name: Page cache keys
        id: cache
        run: |
          echo "day=state-bills-cache-$LABEL-$(date -u +%Y%m%d)-" >> "$GITHUB_OUTPUT"
          echo "resume=state-bills-cache-$LABEL-resume-" >> "$GITHUB_OUTPUT"

      # Resume: a later pass the same day reuses the pages already fetched. A
      # scrape that was cut off or failed also leaves its pages under "resume",
      # so the next pass, even on a later day, carries on from them; a finished
      # scrape leaves an empty "resume" entry, so the next day starts fresh.
      - name: Restore the page cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: ${{ steps.cache.outputs.day }}${{ github.run_id }}
          restore-keys: |
            ${{ steps.cache.outputs.day }}
            ${{ steps.cache.outputs.resume }}

      - name: Server key for syncing
        env:
          KEY: ${{ secrets.SCYTALE_SSH_KEY }}
        run: install -m 600 /dev/null ~/scytale.key && printf '%s\n' "$KEY" > ~/scytale.key

      # Checkpoints (scripts/checkpointed_scrape.sh): at 20 minutes and then
      # hourly, what's scraped so far is checked; proper bills are synced to the
      # server as they come, improper ones stop the scrape and fail the job (the
      # plan job opens an issue). At 5h30m the scrape stops itself and syncs, so
      # the job's 6-hour limit never loses work. --nonstrict: a bill failing Open
      # States' schema (a new action type) is written and logged, not fatal.
      - name: Scrape bills (no database)
        id: scrape
        timeout-minutes: 350
        env:
          SESSION: ${{ steps.session.outputs.args }}
          RPM: ${{ matrix.rpm }}
          # Usually "bills"; state-sources.json names another (VA: csv_bills).
          SCRAPER: ${{ matrix.scraper || 'bills' }}
          NEW_YORK_API_KEY: ${{ secrets.NEW_YORK_API_KEY }}
          INDIANA_API_KEY: ${{ secrets.INDIANA_API_KEY }}
          DC_API_KEY: ${{ secrets.DC_API_KEY }}
          SYNC_HOST: ${{ secrets.SCYTALE_HOST }}
          DEADLINE: "19800"
        run: |
          mkdir -p out cache
          export SYNC_KEY=~/scytale.key
          chamber=${CHAMBER:+chamber=$CHAMBER}
          keys="-e NEW_YORK_API_KEY -e INDIANA_API_KEY -e DC_API_KEY"
          name="scrape-$LABEL"
          if [ "$STATE" = ca ]; then
            # Starts MariaDB, downloads and loads CA's export, then runs os-update ca "$@".
            set -- docker run --rm --name "$name" -v "$PWD/out:/out" -e PYTHONPATH=./scrapers --entrypoint /bin/bash \
              os-scrapers scrapers/ca/ca-entrypoint.sh bills $SESSION $chamber --scrape --nonstrict --datadir /out
          else
            set -- docker run --rm --name "$name" $keys -v "$PWD/out:/out" -v "$PWD/cache:/cache" -v "$PWD/clone/scripts:/tools:ro" \
              -w /opt/openstates/openstates -e PYTHONPATH=/opt/openstates/openstates:/opt/openstates/openstates/scrapers \
              --entrypoint python \
              os-scrapers /tools/resumable_update.py "$STATE" "$SCRAPER" $SESSION $chamber \
              --scrape --nonstrict --datadir /out --cachedir /cache --rpm "$RPM" --retries 5 --retry_wait 30
          fi
          code=0
          clone/scripts/checkpointed_scrape.sh "$STATE" "$LABEL" "out/$STATE" "${SESSION#session=}" "$name" -- "$@" || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      # Its own step, so a scrape cut off or failed still reports what it got.
      - name: Count bills
        id: count
        if: always()
        run: |
          bills=$(find out -name 'bill_*.json' 2>/dev/null | wc -l)
          invalid=$(grep -c "failed validation\|validation of .* failed" scrape.log 2>/dev/null || true)
          [ "${invalid:-0}" = 0 ] && invalid=""
          case "${{ steps.scrape.outputs.code }}" in
            0) how="finished" ;;
            124) how="cut off at the time limit (synced so far; the next pass resumes)" ;;
            3) how="stopped: what was scraped isn't proper bill data" ;;
            *) how="${{ steps.scrape.outcome }}" ;;
          esac
          echo "bills=$bills" >> "$GITHUB_OUTPUT"
          echo "### $STATE $CHAMBER: $how, $bills bills${invalid:+ ($invalid failed Open States validation; kept)}" >> "$GITHUB_STEP_SUMMARY"

      - name: Save the page cache (today)
        if: always() && env.STATE != 'ca'
        uses: actions/cache/save@v4
        with:
          path: cache
          key: ${{ steps.cache.outputs.day }}${{ github.run_id }}

      # Unfinished: the pages, for the next pass to resume. Finished: nothing.
      - name: Empty the resume cache after a finished scrape
        if: always() && env.STATE != 'ca' && steps.scrape.outputs.code == '0'
        run: rm -rf cache && mkdir cache && echo "finished $(date -u +%FT%TZ)" > cache/.finished

      - name: Save the resume cache
        if: always() && env.STATE != 'ca'
        uses: actions/cache/save@v4
        with:
          path: cache
          key: ${{ steps.cache.outputs.resume }}${{ github.run_id }}

      # A finished scrape replaces the state's scraped bills on the server
      # (partial syncs only add) and stamps when it finished.
      - name: Sync the finished scrape
        if: steps.scrape.outputs.code == '0' && steps.count.outputs.bills > 0
        env:
          SYNC_HOST: ${{ secrets.SCYTALE_HOST }}
        run: SYNC_KEY=~/scytale.key clone/scripts/sync_scrape.sh final "$STATE" "$LABEL" "out/$STATE"

      - name: Remove the server key
        if: always()
        run: rm -f ~/scytale.key
